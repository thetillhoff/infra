# https://github.com/postfinance/kubelet-csr-approver/blob/main/charts/kubelet-csr-approver/values.yaml

# Approves the serving certificate requests of the kubelets (`rotate-server-certificates`
# in the Talos patch). Only node names of this cluster pass.
providerRegex: '^hcloud-talos-[a-z0-9-]+$'
# The node names are not in DNS.
bypassDnsResolution: true
# Acts only on a request that states a lifetime. The kubelets state none, so their
# certificates get the 1-year default of the signer.
maxExpirationSeconds: "2592000"
