# defaultProxyClass does not apply to a Connector. The exit nodes keep direct
# WireGuard paths, so this class sets only the resources of prefer-derp.
apiVersion: tailscale.com/v1alpha1
kind: ProxyClass
metadata:
  name: exit-node
spec:
  statefulSet:
    pod:
      # One exit node per cluster node, so that a node loss leaves the others.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              tailscale.com/parent-resource: k8s-exit-node
              tailscale.com/parent-resource-type: connector
      tailscaleContainer:
        resources:
          requests:
            cpu: 10m
            memory: 64Mi
          limits:
            memory: 128Mi
