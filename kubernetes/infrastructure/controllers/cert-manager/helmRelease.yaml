apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cert-manager
spec:
  chart:
    spec:
      chart: cert-manager
      sourceRef:
        kind: HelmRepository
        name: cert-manager
      version: v1.21.2 # From https://artifacthub.io/packages/helm/cert-manager/cert-manager
  interval: 10m
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  driftDetection:
    mode: enabled

  valuesFrom:
    - kind: ConfigMap # This value is case sensitive
      name: cert-manager-helm-values # automatically overridden by kustomize
      # valuesKey: values.yaml # `values.yaml` is the default key
