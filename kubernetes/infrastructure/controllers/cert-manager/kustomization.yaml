apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Temporary: keeps Flux from pruning these objects while they move from infrastructure-controllers.
commonAnnotations:
  kustomize.toolkit.fluxcd.io/prune: disabled
namespace: cert-manager
resources:
- namespace.yaml
- limitRange-default-memory.yaml
- helmRepository.yaml
- helmRelease.yaml

configMapGenerator:
- name: cert-manager-helm-values
  files:
  - values.yaml

configurations:
- kustomizeconfig.yaml # Used to map the generated configmap into the helmRelease
