apiVersion: v1
kind: Service
metadata:
  name: analytics-internal
  namespace: private-endpoints
  annotations:
    tailscale.com/hostname: analytics-internal
    tailscale.com/tags: tag:service
    external-dns.kubernetes.io/hostname: analytics.internal.thetillhoff.de
spec:
  type: LoadBalancer
  loadBalancerClass: tailscale
  selector:
    app: analytics-proxy
  ports:
    - name: https
      port: 443
      targetPort: 8443
