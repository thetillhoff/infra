apiVersion: v1
kind: Service
metadata:
  name: fcp-admin-internal
  namespace: private-endpoints
  annotations:
    tailscale.com/hostname: fcp-admin-internal
    tailscale.com/tags: tag:service
    external-dns.alpha.kubernetes.io/hostname: fcp-admin.internal.thetillhoff.de
spec:
  type: LoadBalancer
  loadBalancerClass: tailscale
  selector:
    app: fcp-admin-proxy
  ports:
    - name: https
      port: 443
      targetPort: 8443
