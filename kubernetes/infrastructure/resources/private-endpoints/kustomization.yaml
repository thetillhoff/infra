apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- namespace.yaml

# Shared caddy image automation (all proxies run the same image)
- imageRepository-caddy.yaml
- imagePolicy-caddy.yaml
- imageUpdateAutomation.yaml

# home.internal.thetillhoff.de — index of all the endpoints below, generated from
# their external-dns hostname annotations
- certificate-home.yaml
- configMap-home-caddy.yaml
- serviceAccount-home-index.yaml
- role-home-index.yaml
- roleBinding-home-index.yaml
- deployment-home-proxy.yaml
- service-home.yaml

# grafana.internal.thetillhoff.de
- certificate-grafana.yaml
- configMap-grafana-caddy.yaml
- deployment-grafana-proxy.yaml
- service-grafana.yaml

# longhorn.internal.thetillhoff.de
- certificate-longhorn.yaml
- configMap-longhorn-caddy.yaml
- deployment-longhorn-proxy.yaml
- service-longhorn.yaml

# hubble.internal.thetillhoff.de
- certificate-hubble.yaml
- configMap-hubble-caddy.yaml
- deployment-hubble-proxy.yaml
- service-hubble.yaml

# trading.internal.thetillhoff.de
- certificate-trading.yaml
- configMap-trading-caddy.yaml
- deployment-trading-proxy.yaml
- service-trading.yaml

# manga-scraper.internal.thetillhoff.de
- certificate-manga-scraper.yaml
- configMap-manga-scraper-caddy.yaml
- deployment-manga-scraper-proxy.yaml
- service-manga-scraper.yaml
