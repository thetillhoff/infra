apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- namespace.yaml

# Shared caddy image automation (all proxies run the same image)
- imageRepository-caddy.yaml
- imagePolicy-caddy.yaml
- imageUpdateAutomation.yaml

# home.internal.thetillhoff.de — index of all the endpoints below (generated from
# their external-dns hostname annotations) plus the external hostnames this cluster
# serves (generated from the public Gateway's listeners)
- certificate-home.yaml
- serviceAccount-home-index.yaml
- role-home-index.yaml
- roleBinding-home-index.yaml
- role-gateways-home-index.yaml
- roleBinding-gateways-home-index.yaml
- deployment-home-proxy.yaml
- service-home.yaml

# grafana.internal.thetillhoff.de
- certificate-grafana.yaml
- deployment-grafana-proxy.yaml
- service-grafana.yaml

# longhorn.internal.thetillhoff.de
- certificate-longhorn.yaml
- deployment-longhorn-proxy.yaml
- service-longhorn.yaml

# hubble.internal.thetillhoff.de
- certificate-hubble.yaml
- deployment-hubble-proxy.yaml
- service-hubble.yaml

# trading.internal.thetillhoff.de
- certificate-trading.yaml
- deployment-trading-proxy.yaml
- service-trading.yaml

# fcp-admin.internal.thetillhoff.de
- certificate-fcp-admin.yaml
- deployment-fcp-admin-proxy.yaml
- service-fcp-admin.yaml

# manga.internal.thetillhoff.de
- certificate-manga.yaml
- deployment-manga-proxy.yaml
- service-manga.yaml

# Caddy config ConfigMaps: generated (not plain resources) so an edit to any
# Caddyfile/index.sh changes the ConfigMap's name hash, which forces the
# owning Deployment to roll — Caddy/the index sidecar don't watch their
# mounted files, so a plain ConfigMap update alone would never redeploy.
configMapGenerator:
- name: home-caddy
  namespace: private-endpoints
  files:
  - Caddyfile=caddy-config/home.Caddyfile
  - index.sh=caddy-config/home.index.sh
- name: grafana-caddy
  namespace: private-endpoints
  files:
  - Caddyfile=caddy-config/grafana.Caddyfile
- name: longhorn-caddy
  namespace: private-endpoints
  files:
  - Caddyfile=caddy-config/longhorn.Caddyfile
- name: hubble-caddy
  namespace: private-endpoints
  files:
  - Caddyfile=caddy-config/hubble.Caddyfile
- name: trading-caddy
  namespace: private-endpoints
  files:
  - Caddyfile=caddy-config/trading.Caddyfile
- name: fcp-admin-caddy
  namespace: private-endpoints
  files:
  - Caddyfile=caddy-config/fcp-admin.Caddyfile
- name: manga-caddy
  namespace: private-endpoints
  files:
  - Caddyfile=caddy-config/manga.Caddyfile
