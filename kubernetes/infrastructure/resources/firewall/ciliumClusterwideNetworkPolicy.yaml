apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: nodes-ingress
spec:
  description: Only web traffic, the Kubernetes API and the Talos API are open to the internet. Everything else is for the nodes and pods of the cluster.
  nodeSelector: {}
  ingress:
    - fromEntities: [world]
      toPorts:
        - ports:
            - {port: "80", protocol: TCP}
            - {port: "443", protocol: TCP}
            - {port: "6443", protocol: TCP}
            - {port: "50000", protocol: TCP}
    - fromEntities: [cluster, host, remote-node]
    # DestinationUnreachable carries "fragmentation needed" for path MTU discovery.
    - fromEntities: [world]
      icmps:
        - fields:
            - {type: DestinationUnreachable, family: IPv4}
            - {type: TimeExceeded, family: IPv4}
            - {type: EchoRequest, family: IPv4}
