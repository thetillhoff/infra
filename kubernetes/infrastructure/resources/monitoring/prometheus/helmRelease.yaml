apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: prometheus
spec:
  chart:
    spec:
      chart: prometheus
      version: 28.16.0
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
  interval: 10m

  # Recreate strategy + RWO PVC: old pod must fully terminate before the new one
  # can bind the volume, and WAL replay under memory pressure is slow. Default ~5m
  # timeout false-fails the release before the rollout converges. 15m absorbs it.
  timeout: 15m
  upgrade:
    timeout: 15m

  valuesFrom:
    - kind: ConfigMap # This value is case sensitive
      name: prometheus-helm-values # automatically overridden by kustomize
      # valuesKey: values.yaml # `values.yaml` is the default key
