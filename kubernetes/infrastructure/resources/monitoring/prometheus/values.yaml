# https://github.com/prometheus-community/helm-charts/blob/main/charts/prometheus/values.yaml

server:
  # Requests set a scheduling floor; the memory limit caps runaway growth. Sized
  # above the WAL-replay + compaction peak of the 15d/9GB TSDB — 1536Mi was too low
  # and OOMKilled prometheus on startup. CPU request only — a CPU limit would throttle.
  resources:
    requests:
      cpu: 100m
      memory: 1Gi
    limits:
      memory: 3Gi
  global:
    scrape_interval: 60s
  # Only /data (the volume) is writable; the config comes from a read-only ConfigMap.
  securityContext:
    seccompProfile:
      type: RuntimeDefault
  containerSecurityContext: &containerSecurityContext
    allowPrivilegeEscalation: false
    capabilities:
      drop: [ALL]
    readOnlyRootFilesystem: true
  persistentVolume:
    enabled: true
    size: 10Gi
  retention: "15d"
  retentionSize: "9GB"
  # Replaces the chart default, so the flag for the config reload must be listed.
  extraFlags:
    - web.enable-lifecycle

# One place for all alert rules; add a rule for a new app here. Every alert
# mails through the Alertmanager below. `max by` drops pod and instance labels,
# so a restart does not create a new alert.
serverFiles:
  alerting_rules.yml:
    groups:
      - name: flux
        rules:
          # flux_resource_info comes from the Flux Operator. `!= "True"` also
          # covers Unknown, so a slow reconcile does not reset the `for` timer.
          # A resource that waits on a failed dependency is skipped: the dependency alerts.
          - alert: FluxResourceNotReady
            expr: max by (kind, exported_namespace, name) (flux_resource_info{ready!="True", reason!="DependencyNotReady", suspended="False"})
            for: 5m
            labels:
              severity: error
            annotations:
              summary: "{{ $labels.kind }} {{ $labels.name }} is not ready"
              description: "Run `flux get {{ $labels.kind | toLower }}s -A` for the reason."
      - name: workloads
        rules:
          - alert: WorkloadUnavailable
            expr: |
              max by (namespace, deployment) (kube_deployment_status_replicas_unavailable > 0)
              or max by (namespace, statefulset) (kube_statefulset_status_replicas_ready < kube_statefulset_replicas)
              or max by (namespace, daemonset) (kube_daemonset_status_number_unavailable > 0)
            for: 15m
            labels:
              severity: error
            annotations:
              summary: "{{ $labels.deployment }}{{ $labels.statefulset }}{{ $labels.daemonset }} in {{ $labels.namespace }} has unavailable replicas"
          - alert: PodCrashLooping
            expr: max by (namespace, pod, container) (kube_pod_container_status_waiting_reason{reason="CrashLoopBackOff"}) == 1
            for: 10m
            labels:
              severity: error
            annotations:
              summary: "{{ $labels.pod }} ({{ $labels.container }}) in {{ $labels.namespace }} is crash looping"
          - alert: PodRestartLoop
            expr: max by (namespace, pod, container) (increase(kube_pod_container_status_restarts_total[10m])) > 3
            for: 10m
            labels:
              severity: error
            annotations:
              summary: "{{ $labels.pod }} ({{ $labels.container }}) in {{ $labels.namespace }} restarted {{ $value | humanize }} times in 10 minutes"
          - alert: ContainerOOMKilled
            expr: |
              max by (namespace, pod, container) (increase(kube_pod_container_status_restarts_total[15m])) > 0
              and on (namespace, pod, container) max by (namespace, pod, container) (kube_pod_container_status_last_terminated_reason{reason="OOMKilled"}) == 1
            labels:
              severity: warning
            annotations:
              summary: "{{ $labels.container }} in {{ $labels.namespace }}/{{ $labels.pod }} was OOM-killed"
              description: "Raise its memory limit or find the leak."
          - alert: PodPending
            expr: max by (namespace, pod) (kube_pod_status_phase{phase="Pending"}) == 1
            for: 5m
            labels:
              severity: error
            annotations:
              summary: "{{ $labels.pod }} in {{ $labels.namespace }} is pending for more than 5 minutes"
      - name: nodes
        rules:
          - alert: NodeNotReady
            expr: max by (node) (kube_node_status_condition{condition="Ready", status="true"}) == 0
            for: 5m
            labels:
              severity: error
            annotations:
              summary: "Node {{ $labels.node }} is not Ready"
          - alert: NodeHighCPU
            expr: 100 - (avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 80
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "CPU usage on {{ $labels.instance }} is {{ $value | humanize }}%"
          - alert: NodeHighMemory
            expr: (1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) * 100 > 85
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "Memory usage on {{ $labels.instance }} is {{ $value | humanize }}%"
          - alert: NodeDiskFull
            expr: (1 - node_filesystem_avail_bytes{fstype!~"tmpfs|overlay"} / node_filesystem_size_bytes{fstype!~"tmpfs|overlay"}) * 100 > 85
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "Disk {{ $labels.mountpoint }} on {{ $labels.instance }} is {{ $value | humanize }}% full"
      - name: monitoring
        rules:
          - alert: TargetDown
            expr: up == 0
            for: 10m
            labels:
              severity: warning
            annotations:
              summary: "Prometheus cannot scrape {{ $labels.job }} target {{ $labels.instance }}"
      - name: storage
        rules:
          - alert: PersistentVolumeClaimPending
            expr: max by (namespace, persistentvolumeclaim) (kube_persistentvolumeclaim_status_phase{phase="Pending"}) == 1
            for: 5m
            labels:
              severity: error
            annotations:
              summary: "PVC {{ $labels.namespace }}/{{ $labels.persistentvolumeclaim }} is pending for more than 5 minutes"
          # The Prometheus PVC is excluded: `server.retentionSize` keeps it at about 90% by design.
          - alert: PersistentVolumeFull
            expr: max by (namespace, persistentvolumeclaim) (kubelet_volume_stats_used_bytes{persistentvolumeclaim!="prometheus-server"} / kubelet_volume_stats_capacity_bytes) * 100 > 85
            for: 15m
            labels:
              severity: warning
            annotations:
              summary: "PVC {{ $labels.namespace }}/{{ $labels.persistentvolumeclaim }} is {{ $value | humanize }}% full"
          # The StorageClass retains PVs, so a deleted PVC leaves a Released PV and its Longhorn volume.
          - alert: PersistentVolumeReleased
            expr: max by (persistentvolume) (kube_persistentvolume_status_phase{phase="Released"}) == 1
            for: 1h
            labels:
              severity: warning
            annotations:
              summary: "PV {{ $labels.persistentvolume }} is Released: delete it and its Longhorn volume, or reuse it"
          # longhorn_volume_robustness: 1 healthy, 2 degraded, 3 faulted.
          - alert: LonghornVolumeNotHealthy
            expr: max by (volume, pvc_namespace, pvc) (longhorn_volume_robustness) > 1
            for: 15m
            labels:
              severity: error
            annotations:
              summary: "Longhorn volume {{ $labels.volume }} ({{ $labels.pvc_namespace }}/{{ $labels.pvc }}) is degraded or faulted"
          # longhorn_backup_state 4 = Error.
          - alert: LonghornBackupFailed
            expr: max by (volume, backup) (longhorn_backup_state) == 4
            labels:
              severity: error
            annotations:
              summary: "Longhorn backup {{ $labels.backup }} of volume {{ $labels.volume }} failed"
          # The RecurringJob `daily` backs up every volume at 05:00.
          - alert: LonghornBackupMissing
            expr: max by (volume, pvc_namespace, pvc) (time() - longhorn_volume_last_backup_at) > 36 * 3600
            for: 1h
            labels:
              severity: error
            annotations:
              summary: "Longhorn volume {{ $labels.volume }} ({{ $labels.pvc_namespace }}/{{ $labels.pvc }}) has no backup for more than 36 hours"
          - alert: LonghornBackupTargetUnavailable
            expr: max by (backup_target) (longhorn_backup_target_status) == 0
            for: 30m
            labels:
              severity: error
            annotations:
              summary: "The Longhorn backup target {{ $labels.backup_target }} is not available"
      - name: certificates
        rules:
          # cert-manager renews at 2/3 of the lifetime (30 days before expiry for Let's Encrypt).
          - alert: CertificateExpiringSoon
            expr: max by (namespace, name) (certmanager_certificate_expiration_timestamp_seconds - time()) < 14 * 86400
            for: 1h
            labels:
              severity: error
            annotations:
              summary: "Certificate {{ $labels.namespace }}/{{ $labels.name }} expires in {{ $value | humanizeDuration }}"
          - alert: CertificateNotReady
            expr: max by (namespace, name) (certmanager_certificate_ready_status{condition!="True"}) == 1
            for: 1h
            labels:
              severity: error
            annotations:
              summary: "Certificate {{ $labels.namespace }}/{{ $labels.name }} is not Ready"
      - name: network
        rules:
          # Policy denies are expected (default-deny namespaces, node firewall); other drop reasons point to a fault.
          - alert: CiliumHighDropRate
            expr: sum by (reason) (rate(cilium_drop_count_total{reason!~"Policy denied|Unsupported L3 protocol"}[10m])) > 1
            for: 15m
            labels:
              severity: warning
            annotations:
              summary: "Cilium drops {{ $value | humanize }} packets/s with reason '{{ $labels.reason }}'"
      - name: federated-cloud-platform
        rules:
          # The spot jobs have their own rule below.
          - alert: FcpJobFailed
            expr: |
              max by (namespace, job_name) (kube_job_status_failed{namespace="federated-cloud-platform", job_name!~"spot-(azure|aws)-.*"} > 0)
              unless on (namespace, job_name) (kube_job_status_succeeded{namespace="federated-cloud-platform"} > 0)
              and on (namespace, job_name) ((time() - max by (namespace, job_name) (kube_job_status_start_time{namespace="federated-cloud-platform"})) < 86400)
            for: 15m
            labels:
              severity: error
            annotations:
              summary: "Job {{ $labels.job_name }} in federated-cloud-platform failed and did not succeed"
              description: "Run `kubectl logs -n federated-cloud-platform job/{{ $labels.job_name }}`."
          # concurrencyPolicy Forbid skips a run while the previous Job still runs, so a hung Job stops the schedule.
          - alert: FcpCronJobMissedSchedule
            expr: max by (namespace, cronjob) (time() - kube_cronjob_next_schedule_time{namespace="federated-cloud-platform"}) > 900
            for: 15m
            labels:
              severity: error
            annotations:
              summary: "CronJob {{ $labels.cronjob }} in federated-cloud-platform missed its schedule"
              description: "Run `kubectl describe cronjob -n federated-cloud-platform {{ $labels.cronjob }}`."
          - alert: FcpSpotCronJobNoSuccess
            expr: |
              (
                max by (namespace, cronjob) (time() - kube_cronjob_status_last_successful_time{namespace="federated-cloud-platform", cronjob=~"spot-(azure|aws)"})
                or max by (namespace, cronjob) (time() - kube_cronjob_created{namespace="federated-cloud-platform", cronjob=~"spot-(azure|aws)"})
              ) > 21600
            for: 15m
            labels:
              severity: error
            annotations:
              summary: "CronJob {{ $labels.cronjob }} in federated-cloud-platform has no successful run for 6 hours"

configmapReload:
  prometheus:
    containerSecurityContext: *containerSecurityContext
    resources:
      requests:
        cpu: 5m
        memory: 16Mi
      limits:
        memory: 32Mi

# Subchart resources below: sized from the 14-day peak working set, limit about 2x. No CPU limit.
kube-state-metrics:
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      memory: 128Mi

prometheus-node-exporter:
  extraArgs:
    - --no-collector.kernel_hung
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 64Mi

# Receives the alerts of the Prometheus rules above. It mails through the SMTP
# account of Grafana, so the password is mounted from the grafana-smtp secret.
alertmanager:
  enabled: true
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 64Mi
  configmapReload:
    resources:
      requests:
        cpu: 5m
        memory: 32Mi
      limits:
        memory: 64Mi
  persistence:
    enabled: false
  extraSecretMounts:
    - name: smtp
      mountPath: /etc/alertmanager/smtp
      secretName: grafana-smtp
      readOnly: true
  config:
    global:
      smtp_smarthost: smtp.gmail.com:587
      smtp_from: thetillhoff@gmail.com
      smtp_auth_username: thetillhoff@gmail.com
      smtp_auth_password_file: /etc/alertmanager/smtp/GF_SMTP_PASSWORD
      smtp_require_tls: true
    route:
      receiver: email
      group_by: ["..."]
      repeat_interval: 24h
    receivers:
      - name: email
        email_configs:
          - to: thetillhoff@gmail.com
            send_resolved: true

prometheus-pushgateway:
  enabled: false

# Convention-based auto-discovery: any Service with a port named `metrics`,
# `<something>-metrics`, or `prometheus` is scraped automatically without needing
# any annotations. This matches the port-naming convention used by virtually all
# modern Helm charts (Grafana, Loki, Alloy, Cilium, cert-manager, ...).
#
# Opt-out for a specific service: `prometheus.io/scrape: "false"` annotation.
# Opt-in for services that don't follow the convention: `prometheus.io/scrape: "true"`
# annotation (handled by the chart's default scrape jobs).
extraScrapeConfigs: |
  - job_name: kubernetes-service-endpoints-by-port-name
    kubernetes_sd_configs:
      - role: endpointslice
    relabel_configs:
      - source_labels: [__meta_kubernetes_endpointslice_port_name]
        action: keep
        regex: (metrics|.+-metrics|prometheus)
      - source_labels: [__meta_kubernetes_service_annotation_prometheus_io_scrape]
        action: drop
        regex: "false"
      - source_labels: [__meta_kubernetes_service_annotation_prometheus_io_path]
        action: replace
        target_label: __metrics_path__
        regex: (.+)
      - source_labels: [__meta_kubernetes_namespace]
        target_label: namespace
      - source_labels: [__meta_kubernetes_service_name]
        target_label: service
      - source_labels: [__meta_kubernetes_pod_name]
        target_label: pod
      - source_labels: [__meta_kubernetes_pod_node_name]
        target_label: node
