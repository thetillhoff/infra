# https://github.com/prometheus-community/helm-charts/blob/main/charts/prometheus/values.yaml

server:
  # Requests set a scheduling floor; the memory limit caps runaway growth. Sized
  # above the WAL-replay + compaction peak of the 15d/9GB TSDB — 1536Mi was too low
  # and OOMKilled prometheus on startup. CPU request only — a CPU limit would throttle.
  resources:
    requests:
      cpu: 100m
      memory: 1Gi
    limits:
      memory: 3Gi
  global:
    scrape_interval: 60s
  persistentVolume:
    enabled: true
    size: 10Gi
  retention: "15d"
  retentionSize: "9GB"
  extraFlags:
    - web.enable-remote-write-receiver

prometheus-node-exporter:
  extraArgs:
    - --no-collector.kernel_hung

# Only Flux notification-controller posts here, because Grafana's built-in
# Alertmanager rejects the standard array payload. It mails through the SMTP
# account of Grafana, so the password is mounted from the grafana-smtp secret.
alertmanager:
  enabled: true
  persistence:
    enabled: false
  extraSecretMounts:
    - name: smtp
      mountPath: /etc/alertmanager/smtp
      secretName: grafana-smtp
      readOnly: true
  config:
    global:
      smtp_smarthost: smtp.gmail.com:587
      smtp_from: thetillhoff@gmail.com
      smtp_auth_username: thetillhoff@gmail.com
      smtp_auth_password_file: /etc/alertmanager/smtp/GF_SMTP_PASSWORD
      smtp_require_tls: true
    route:
      receiver: email
    receivers:
      - name: email
        email_configs:
          - to: thetillhoff@gmail.com

prometheus-pushgateway:
  enabled: false

# Convention-based auto-discovery: any Service with a port named `metrics`,
# `<something>-metrics`, or `prometheus` is scraped automatically without needing
# any annotations. This matches the port-naming convention used by virtually all
# modern Helm charts (Grafana, Loki, Alloy, Cilium, cert-manager, ...).
#
# Opt-out for a specific service: `prometheus.io/scrape: "false"` annotation.
# Opt-in for services that don't follow the convention: `prometheus.io/scrape: "true"`
# annotation (handled by the chart's default scrape jobs).
extraScrapeConfigs: |
  - job_name: kubernetes-service-endpoints-by-port-name
    kubernetes_sd_configs:
      - role: endpointslice
    relabel_configs:
      - source_labels: [__meta_kubernetes_endpointslice_port_name]
        action: keep
        regex: (metrics|.+-metrics|prometheus)
      - source_labels: [__meta_kubernetes_service_annotation_prometheus_io_scrape]
        action: drop
        regex: "false"
      - source_labels: [__meta_kubernetes_service_annotation_prometheus_io_path]
        action: replace
        target_label: __metrics_path__
        regex: (.+)
      - source_labels: [__meta_kubernetes_namespace]
        target_label: namespace
      - source_labels: [__meta_kubernetes_service_name]
        target_label: service
      - source_labels: [__meta_kubernetes_pod_name]
        target_label: pod
      - source_labels: [__meta_kubernetes_pod_node_name]
        target_label: node
