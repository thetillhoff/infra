# https://github.com/prometheus-community/helm-charts/blob/main/charts/prometheus/values.yaml

server:
  # Requests set a scheduling floor; the memory limit caps runaway growth. Sized
  # above the WAL-replay + compaction peak of the 15d/9GB TSDB — 1536Mi was too low
  # and OOMKilled prometheus on startup. CPU request only — a CPU limit would throttle.
  resources:
    requests:
      cpu: 100m
      memory: 1Gi
    limits:
      memory: 3Gi
  global:
    scrape_interval: 60s
  persistentVolume:
    enabled: true
    size: 10Gi
  retention: "15d"
  retentionSize: "9GB"
  # Replaces the chart default, so the flag for the config reload must be listed.
  extraFlags:
    - web.enable-lifecycle
    - web.enable-remote-write-receiver

# One place for all alert rules; add a rule for a new app here. Every alert
# mails through the Alertmanager below. `max by` drops pod and instance labels,
# so a restart does not create a new alert.
serverFiles:
  alerting_rules.yml:
    groups:
      - name: flux
        rules:
          # flux_resource_info comes from the Flux Operator. `!= "True"` also
          # covers Unknown, so a slow reconcile does not reset the `for` timer.
          # A resource that waits on a failed dependency is skipped: the dependency alerts.
          - alert: FluxResourceNotReady
            expr: max by (kind, exported_namespace, name) (flux_resource_info{ready!="True", reason!="DependencyNotReady", suspended="False"})
            for: 5m
            labels:
              severity: error
            annotations:
              summary: "{{ $labels.kind }} {{ $labels.name }} is not ready"
              description: "Run `flux get {{ $labels.kind | toLower }}s -A` for the reason."
      - name: workloads
        rules:
          - alert: WorkloadUnavailable
            expr: |
              max by (namespace, deployment) (kube_deployment_status_replicas_unavailable > 0)
              or max by (namespace, statefulset) (kube_statefulset_status_replicas_ready < kube_statefulset_replicas)
              or max by (namespace, daemonset) (kube_daemonset_status_number_unavailable > 0)
            for: 15m
            labels:
              severity: error
            annotations:
              summary: "{{ $labels.deployment }}{{ $labels.statefulset }}{{ $labels.daemonset }} in {{ $labels.namespace }} has unavailable replicas"
          - alert: PodCrashLooping
            expr: max by (namespace, pod, container) (kube_pod_container_status_waiting_reason{reason="CrashLoopBackOff"}) == 1
            for: 10m
            labels:
              severity: error
            annotations:
              summary: "{{ $labels.pod }} ({{ $labels.container }}) in {{ $labels.namespace }} is crash looping"

prometheus-node-exporter:
  extraArgs:
    - --no-collector.kernel_hung

# Receives the alerts of the Prometheus rules above. It mails through the SMTP
# account of Grafana, so the password is mounted from the grafana-smtp secret.
alertmanager:
  enabled: true
  persistence:
    enabled: false
  extraSecretMounts:
    - name: smtp
      mountPath: /etc/alertmanager/smtp
      secretName: grafana-smtp
      readOnly: true
  config:
    global:
      smtp_smarthost: smtp.gmail.com:587
      smtp_from: thetillhoff@gmail.com
      smtp_auth_username: thetillhoff@gmail.com
      smtp_auth_password_file: /etc/alertmanager/smtp/GF_SMTP_PASSWORD
      smtp_require_tls: true
    route:
      receiver: email
      group_by: ["..."]
      repeat_interval: 24h
    receivers:
      - name: email
        email_configs:
          - to: thetillhoff@gmail.com
            send_resolved: true

prometheus-pushgateway:
  enabled: false

# Convention-based auto-discovery: any Service with a port named `metrics`,
# `<something>-metrics`, or `prometheus` is scraped automatically without needing
# any annotations. This matches the port-naming convention used by virtually all
# modern Helm charts (Grafana, Loki, Alloy, Cilium, cert-manager, ...).
#
# Opt-out for a specific service: `prometheus.io/scrape: "false"` annotation.
# Opt-in for services that don't follow the convention: `prometheus.io/scrape: "true"`
# annotation (handled by the chart's default scrape jobs).
extraScrapeConfigs: |
  - job_name: kubernetes-service-endpoints-by-port-name
    kubernetes_sd_configs:
      - role: endpointslice
    relabel_configs:
      - source_labels: [__meta_kubernetes_endpointslice_port_name]
        action: keep
        regex: (metrics|.+-metrics|prometheus)
      - source_labels: [__meta_kubernetes_service_annotation_prometheus_io_scrape]
        action: drop
        regex: "false"
      - source_labels: [__meta_kubernetes_service_annotation_prometheus_io_path]
        action: replace
        target_label: __metrics_path__
        regex: (.+)
      - source_labels: [__meta_kubernetes_namespace]
        target_label: namespace
      - source_labels: [__meta_kubernetes_service_name]
        target_label: service
      - source_labels: [__meta_kubernetes_pod_name]
        target_label: pod
      - source_labels: [__meta_kubernetes_pod_node_name]
        target_label: node
