# https://github.com/grafana-community/helm-charts/blob/main/charts/loki/values.yaml

loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  schemaConfig:
    configs:
      - from: 2024-04-01
        object_store: filesystem
        store: tsdb
        schema: v13
        index:
          prefix: index_
          period: 24h
  storage:
    type: filesystem
  pattern_ingester:
      enabled: true
  # Without this, chunks are never deleted: the PVC was 35% full after 36 days (~48Mi/day) and
  # would have hit ENOSPC in ~67 more. SingleBinary runs the compactor in-process, so the
  # top-level `compactor.replicas: 0` below does not disable it.
  compactor:
    retention_enabled: true
    delete_request_store: filesystem
  limits_config:
    allow_structured_metadata: true
    volume_enabled: true
    # 30d ≈ 1.4Gi at the measured rate, leaving headroom in the 5Gi PVC.
    retention_period: 720h
    # cilium-agent carries the hubble L7 flow log (one line per HTTP request cluster-wide), so it
    # is by far the highest-volume and shortest-useful stream. 7d bounds it without touching the
    # rest. Covers the agent's own logs too - same stream labels, and they age out just as fast.
    retention_stream:
      - selector: '{container="cilium-agent"}'
        priority: 1
        period: 168h
  ruler:
    enable_api: true

deploymentMode: SingleBinary

singleBinary:
  replicas: 1
  persistence:
    size: 5Gi
  # Requests = scheduling floor (Burstable, so it's not a first-evicted BestEffort);
  # limit generous vs the ~100-200Mi working set to avoid OOMKilling loki on a spike.
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      memory: 1Gi

# disable resouce hogging chunks cache - we're on local disk anyways
chunksCache:
  enabled: false

# Zero out replica counts of other deployment modes
backend:
  replicas: 0
read:
  replicas: 0
write:
  replicas: 0
ingester:
  replicas: 0
querier:
  replicas: 0
queryFrontend:
  replicas: 0
queryScheduler:
  replicas: 0
distributor:
  replicas: 0
compactor:
  replicas: 0
indexGateway:
  replicas: 0
bloomPlanner:
  replicas: 0
bloomBuilder:
  replicas: 0
bloomGateway:
  replicas: 0
