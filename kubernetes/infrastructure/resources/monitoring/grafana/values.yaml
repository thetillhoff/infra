# https://github.com/grafana-community/helm-charts/blob/main/charts/grafana/values.yaml

admin:
  existingSecret: grafana-admin
  userKey: admin-user
  passwordKey: admin-password

envFromSecret: grafana-smtp

# Served behind the Caddy proxy at grafana.internal.thetillhoff.de (TLS terminated
# at the proxy, HTTP to grafana). root_url makes grafana build correct absolute URLs
# (redirects, assets, Grafana Live websocket) for that external domain — without it
# the SPA spins ("keeps loading"). Trailing slash per the docs (root-domain form).
# Grafana Live's /api/live websocket upgrade is handled automatically by Caddy's
# reverse_proxy, so no extra proxy/grafana config is needed. serve_from_sub_path
# stays off — we serve at the domain root, not a subpath.
grafana.ini:
  server:
    domain: grafana.internal.thetillhoff.de
    root_url: https://grafana.internal.thetillhoff.de/
  # Alert mail. The password comes from the grafana-smtp secret as GF_SMTP_PASSWORD.
  # Gmail only accepts the account's own address as sender.
  smtp:
    enabled: true
    host: smtp.gmail.com:587
    user: thetillhoff@gmail.com
    from_address: thetillhoff@gmail.com
    startTLS_policy: MandatoryStartTLS

# Grafana's service port is named `service` (not something our port-name auto-discovery
# matches), so annotate the Service explicitly. Prometheus scrapes the pod IP, so the
# port is the container port (3000), not the Service port (80).
service:
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "3000"

datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:

    - name: Prometheus
      uid: prometheus
      type: prometheus
      url: http://prometheus-server
      access: proxy
      isDefault: true
      jsonData:
        timeInterval: 15s

    - name: Loki
      uid: loki
      type: loki
      url: http://loki:3100
      access: proxy

dashboardProviders:
  dashboardproviders.yaml:
    apiVersion: 1
    providers:
    - name: default
      orgId: 1
      folder: ''
      type: file
      disableDeletion: false
      editable: true
      options:
        path: /var/lib/grafana/dashboards/default

dashboards:
  default:
    node-exporter-full:
      gnetId: 1860
      revision: 37
      datasource: Prometheus
    loki-logs:
      gnetId: 13639
      revision: 2
      datasource:
        - name: DS_LOKI
          value: Loki

resources:
  requests:
    memory: 256Mi
  limits:
    memory: 1Gi
