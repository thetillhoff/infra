apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: grafana
spec:
  chart:
    spec:
      chart: grafana
      version: 14.0.1
      sourceRef:
        kind: HelmRepository
        name: grafana-community
  interval: 10m
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  driftDetection:
    mode: enabled

  valuesFrom:
    - kind: ConfigMap # This value is case sensitive
      name: grafana-helm-values # automatically overridden by kustomize
      # valuesKey: values.yaml # `values.yaml` is the default key
