apiVersion: notification.toolkit.fluxcd.io/v1beta3
kind: Provider
metadata:
  name: grafana-alertmanager
  namespace: flux-system
spec:
  type: alertmanager
  # Grafana's built-in Alertmanager: its notification policy routes these events to the email contact point.
  address: http://grafana.monitoring.svc.cluster.local/api/alertmanager/grafana/api/v2/alerts/
  secretRef:
    name: grafana-alertmanager-token
