apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: arc-runners
resources:
- namespace.yaml
- limitRange-default-memory.yaml
- networkPolicy-default-deny-ingress.yaml
- ciliumNetworkPolicy-egress-internet-only.yaml
- github-app.secret.yaml
- helmRelease-manga-scraper.yaml
- helmRelease-federated-cloud-platform.yaml
- helmRelease-tape.yaml

configMapGenerator:
- name: arc-runners-helm-values
  files:
  - values.yaml
- name: arc-runners-helm-values-manga-scraper
  files:
  - values.yaml=values-manga-scraper.yaml
- name: arc-runners-helm-values-federated-cloud-platform
  files:
  - values.yaml=values-federated-cloud-platform.yaml
- name: arc-runners-helm-values-tape
  files:
  - values.yaml=values-tape.yaml

configurations:
- kustomizeconfig.yaml # Used to map the generated configmap into the helmRelease
