apiVersion: apps/v1
kind: Deployment
metadata:
  name: thetillhoff-de
spec:
  selector:
    matchLabels:
      app: thetillhoff-de
  replicas: 2
  template:
    metadata:
      labels:
        app: thetillhoff-de
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      initContainers:
      # Fetches the website id from umami; the site container reads it through fileKeyRef.
      - name: fetch-website-id
        image: alpine/k8s:1.36.5
        command: ["bash", "/scripts/fetch-website-id.sh"]
        envFrom:
        - secretRef:
            name: umami-reader
        securityContext:
          runAsNonRoot: true
          runAsUser: 65534
          allowPrivilegeEscalation: false
          seccompProfile:
            type: RuntimeDefault
          capabilities:
            drop: ["ALL"]
        volumeMounts:
        - name: scripts
          mountPath: /scripts
        - name: config
          mountPath: /config
      containers:
      - name: thetillhoff-de
        image: ghcr.io/thetillhoff/thetillhoff.de:v1.5.0 # {"$imagepolicy": "thetillhoff-de:thetillhoff-de"}
        ports:
        - containerPort: 80
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: [ALL]
            add: [NET_BIND_SERVICE]
        env:
        - name: UMAMI_WEBSITE_ID
          valueFrom:
            fileKeyRef:
              volumeName: config
              path: config.env
              key: UMAMI_WEBSITE_ID
              optional: true
        livenessProbe:
          httpGet:
            port: 8080
          initialDelaySeconds: 5
        volumeMounts:
        # Caddy writes its autosave config and state here.
        - name: caddy-data
          mountPath: /data
        - name: caddy-config
          mountPath: /config
      volumes:
      - name: scripts
        configMap:
          name: fetch-website-id
      - name: config
        emptyDir: {}
      - name: caddy-data
        emptyDir: {}
      - name: caddy-config
        emptyDir: {}
