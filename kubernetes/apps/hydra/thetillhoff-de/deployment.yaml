apiVersion: apps/v1
kind: Deployment
metadata:
  name: thetillhoff-de
spec:
  selector:
    matchLabels:
      app: thetillhoff-de
  replicas: 2
  template:
    metadata:
      labels:
        app: thetillhoff-de
    spec:
      containers:
      - name: thetillhoff-de
        image: ghcr.io/thetillhoff/thetillhoff.de:v1.4.4 # {"$imagepolicy": "thetillhoff-de:thetillhoff-de"}
        ports:
        - containerPort: 80
        env:
        - name: UMAMI_WEBSITE_ID
          value: b231247b-1848-45f0-a1a8-4745d7b84d3d
        livenessProbe:
          httpGet:
            port: 8080
          initialDelaySeconds: 5
