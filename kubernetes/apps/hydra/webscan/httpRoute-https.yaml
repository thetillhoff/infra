apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: webscan-https
spec:
  parentRefs:
  - name: https-gateway-thetillhoff-de
    namespace: gateways
  hostnames:
  - webscan.thetillhoff.de
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    filters:
    - type: ResponseHeaderModifier
      responseHeaderModifier:
        set:
        - name: Strict-Transport-Security
          value: max-age=31536000
    backendRefs:
    - name: webscan
      port: 80
