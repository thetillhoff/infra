apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: umami
  namespace: umami
spec:
  serviceName: umami
  selector:
    matchLabels:
      app: umami
  replicas: 1
  template:
    metadata:
      labels:
        app: umami
      annotations:
        kubernetes.io/egress-bandwidth: "5M"
        kubernetes.io/ingress-bandwidth: "10M"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 65533
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: umami
        image: ghcr.io/umami-software/umami:postgresql-v2.20.2 # {"$imagepolicy": "umami:umami"}
        resources:
          requests:
            memory: 128Mi
          limits:
            memory: 512Mi
        # Prisma fetches its schema engine into node_modules at start, so the root filesystem stays writable.
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: [ALL]
        ports:
        - containerPort: 3000
          livenessProbe:
            initialDelaySeconds: 30
            httpGet:
              path: /api/heartbeat
              port: 3000
        env:
        - name: HOSTNAME
          value: 0.0.0.0
        # - name: FORCE_SSL
        #   value: "0"
        - name: DISABLE_TELEMETRY
          value: "1"
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: umami
              key: DATABASE_URL
