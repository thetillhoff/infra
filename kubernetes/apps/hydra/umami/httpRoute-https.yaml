apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: analytics-thetillhoff-de-https
spec:
  parentRefs:
  - name: https-gateway-thetillhoff-de
    namespace: gateways
  hostnames:
  - analytics.thetillhoff.de
  rules:
  # Public: only what the tracker script on the websites needs. The UI is internal.
  - matches:
    - path:
        type: Exact
        value: /script.js
    - path:
        type: Exact
        value: /api/send
    backendRefs:
    - name: umami
      port: 80
