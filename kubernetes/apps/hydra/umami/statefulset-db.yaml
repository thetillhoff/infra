apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: db
spec:
  serviceName: db
  selector:
    matchLabels:
      app: db
  replicas: 1
  template:
    metadata:
      labels:
        app: db
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: postgres
        image: postgres:17.11-alpine # No image policy set, to prevent major updates from breaking things
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: [ALL]
        ports:
        - containerPort: 5432
        livenessProbe:
          initialDelaySeconds: 30
          failureThreshold: 6
          exec:
            command: ["pg_isready"]

        env:
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: db
              key: POSTGRES_PASSWORD
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: db
              key: POSTGRES_USER

        # Fixing the following error:
        # initdb: error: directory "/var/lib/postgresql/data" exists but is not empty
        # initdb: detail: It contains a lost+found directory, perhaps due to it being a mount point.
        # initdb: hint: Using a mount point directly as the data directory is not recommended.
        # Create a subdirectory under the mount point.
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata

        volumeMounts:
        - name: db-data
          mountPath: "/var/lib/postgresql/data"
        # The unix socket and temporary files.
        - name: run
          mountPath: /var/run/postgresql
        - name: tmp
          mountPath: /tmp

      volumes:
      - name: run
        emptyDir: {}
      - name: tmp
        emptyDir: {}
  volumeClaimTemplates:
  - metadata:
      name: db-data
    spec:
      accessModes: [ "ReadWriteOnce" ]
      storageClassName: "longhorn"
      resources:
        requests:
          storage: 1Gi
