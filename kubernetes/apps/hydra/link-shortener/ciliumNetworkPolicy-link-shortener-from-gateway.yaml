apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: link-shortener-from-gateway
# The Cilium Gateway reaches the pod as the entity `ingress`, which a NetworkPolicy cannot select.
spec:
  endpointSelector:
    matchLabels:
      app: link-shortener
  ingress:
    - fromEntities: [ingress]
      toPorts:
        - ports:
            - port: "80"
              protocol: TCP
