apiVersion: v1
kind: ServiceAccount
metadata:
  name: trading-worker-readonly
  namespace: trading
# The pull secret lives HERE, not on each Job: the operator templates thousands of Jobs and restating it
# per Job gives two places to keep in step. Without it every worker Job ImagePullBackOffs and the grid
# stalls with no operator-side error to look at.
imagePullSecrets:
  - name: ghcr-creds
