apiVersion: apps/v1
kind: Deployment
metadata:
  name: ibkr-broker
  namespace: trading
spec:
  replicas: 1
  # Recreate, not RollingUpdate: this pod holds an exclusive IBKR connection keyed by
  # IBKR_CLIENT_ID. Under a rolling update the new pod starts while the old one still holds
  # client id 2, the gateway refuses it with "Error 326: client id already in use", and the
  # broker comes up with no connection while /health still answers 200.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: ibkr-broker
  template:
    metadata:
      labels:
        app: ibkr-broker
    spec:
      imagePullSecrets:
        - name: ghcr-creds
      containers:
        - name: ibkr-broker
          image: ghcr.io/thetillhoff/trading-ibkr-broker:174 # {"$imagepolicy": "trading:trading-ibkr-broker"}
          workingDir: /app/broker
          command:
            - "uvicorn"
            - "app:app"
            - "--host"
            - "0.0.0.0"
            - "--port"
            - "8002"
          envFrom:
            - secretRef:
                name: trading-ibkr
          env:
            - name: IBKR_HOST
              value: ibkr-gateway
            - name: IBKR_PORT
              value: "4004"
            - name: IBKR_CLIENT_ID
              value: "2"
            # This pod holds the only warm broker connection, so it also runs the periodic
            # reconcile (order/position state vs broker truth) and appends the wallet series.
            # Without the DSN it degrades to serving snapshots only.
            - name: POSTGRES_DSN
              valueFrom:
                secretKeyRef:
                  name: trading-postgres
                  key: dsn
          ports:
            - containerPort: 8002
          readinessProbe:
            httpGet:
              path: /health
              port: 8002
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - "ALL"
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 256Mi
