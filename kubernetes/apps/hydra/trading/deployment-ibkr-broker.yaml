apiVersion: apps/v1
kind: Deployment
metadata:
  name: ibkr-broker
  namespace: trading
spec:
  replicas: 1
  # maxSurge 0: the old pod must be GONE before the new one starts. This pod holds an
  # exclusive IBKR connection keyed by IBKR_CLIENT_ID, so an overlapping replica is refused
  # by the gateway with "Error 326: client id already in use" and the broker then comes up
  # with no connection at all while /health still answers 200.
  #
  # `type: Recreate` expresses the same thing and is what the intent is, but it cannot be
  # applied to a Deployment that already exists: the API server has defaulted
  # spec.strategy.rollingUpdate, server-side apply does not remove a subfield another manager
  # owns, and the merged object is then rejected as invalid on every retry forever.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: ibkr-broker
  template:
    metadata:
      labels:
        app: ibkr-broker
    spec:
      imagePullSecrets:
        - name: ghcr-creds
      containers:
        - name: ibkr-broker
          image: ghcr.io/thetillhoff/trading-ibkr-broker:174 # {"$imagepolicy": "trading:trading-ibkr-broker"}
          workingDir: /app/broker
          command:
            - "uvicorn"
            - "app:app"
            - "--host"
            - "0.0.0.0"
            - "--port"
            - "8002"
          envFrom:
            - secretRef:
                name: trading-ibkr
          env:
            - name: IBKR_HOST
              value: ibkr-gateway
            - name: IBKR_PORT
              value: "4004"
            - name: IBKR_CLIENT_ID
              value: "2"
            # This pod holds the only warm broker connection, so it also runs the periodic
            # reconcile (order/position state vs broker truth) and appends the wallet series.
            # Without the DSN it degrades to serving snapshots only.
            - name: POSTGRES_DSN
              valueFrom:
                secretKeyRef:
                  name: trading-postgres
                  key: dsn
          ports:
            - containerPort: 8002
          readinessProbe:
            httpGet:
              path: /health
              port: 8002
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - "ALL"
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 256Mi
