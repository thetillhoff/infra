apiVersion: batch/v1
kind: CronJob
metadata:
  name: livetrade-close
  namespace: trading
spec:
  # NO `suspend:` HERE, deliberately. The trading-operator owns this field: it suspends
  # whichever session does not match the active StrategyConfig's execution column, and both
  # when AutoTrade is disabled (trading_operator/handlers/autotrade.py). Declaring it here
  # would hand the field to Flux's server-side apply, which would then revert the operator
  # on every reconcile. Cluster and git differing on `suspend` is correct, not drift.
  schedule: "30 16 * * 1-5"
  timeZone: America/New_York
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 600
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        # `app: livetrade` is what networkPolicy-ibkr-gateway.yaml allows through to the gateway's
        # unauthenticated API. Without it this Job cannot connect at all, and the symptom is a cycle
        # that runs, finds its signals and places nothing.
        metadata:
          labels:
            app: livetrade
        spec:
          priorityClassName: trading-batch-low
          serviceAccountName: trading-worker
          restartPolicy: Never
          containers:
            - name: livetrade
              image: ghcr.io/thetillhoff/trading-livetrade:130 # {"$imagepolicy": "trading:trading-livetrade"}
              imagePullPolicy: IfNotPresent
              env:
                - name: TRIGGER
                  value: close
                - name: NAMESPACE
                  value: trading
                - name: IBKR_HOST
                  value: ibkr-gateway
                - name: IBKR_PORT
                  value: "4004"
                - name: POSTGRES_DSN
                  valueFrom:
                    secretKeyRef:
                      name: trading-postgres
                      key: dsn
              envFrom:
                - secretRef:
                    name: trading-ibkr
              resources:
                # request = limit → Guaranteed QoS: reserves its full budget so the
                # scheduler queues it (Pending) rather than overcommitting, and caps it
                # so a spike can't take the node down. No CPU limit (avoids throttling).
                requests:
                  cpu: 500m
                  memory: 1Gi
                limits:
                  memory: 1Gi
