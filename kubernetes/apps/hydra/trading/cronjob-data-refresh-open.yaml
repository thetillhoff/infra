apiVersion: batch/v1
kind: CronJob
metadata:
  name: data-refresh-open
  namespace: trading
spec:
  schedule: "35 10 * * 1-5"
  timeZone: America/New_York
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 600
  suspend: false   # always-on; refreshes full universe after market open regardless of AutoTrade state
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          serviceAccountName: trading-worker
          restartPolicy: Never
          priorityClassName: trading-batch-low
          containers:
            - name: data-refresh
              # NOT bitnami/kubectl: that catalog moved to bitnamilegacy, so `:latest` there is a
              # mutable tag that can stop resolving - on the pod that triggers every price refresh.
              # Kept on the CLUSTER's minor (1.36): kubectl supports one minor of skew either way.
              image: registry.k8s.io/kubectl:v1.36.2
              imagePullPolicy: IfNotPresent
              command:
                - sh
                - -c
              args:
                - |
                  kubectl create -f - <<'EOF'
                  apiVersion: trading.thetillhoff.de/v1alpha1
                  kind: DataUpdate
                  metadata:
                    generateName: data-refresh-open-
                    namespace: trading
                  spec:
                    requestedAt: ""
                  EOF
              resources:
                # memory request==limit (Guaranteed); no CPU limit (avoids throttling).
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  memory: 128Mi
