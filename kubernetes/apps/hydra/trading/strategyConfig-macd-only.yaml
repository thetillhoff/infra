apiVersion: trading.thetillhoff.de/v1alpha1
kind: StrategyConfig
metadata:
  name: macd-only
  namespace: trading
spec:
  name: macd-only
  description: MACD alone, champion risk/costs/universe. Best-ranked arm of the component
