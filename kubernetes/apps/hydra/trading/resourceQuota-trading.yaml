apiVersion: v1
kind: ResourceQuota
metadata:
  name: trading-quota
  namespace: trading
spec:
  # Hard ceiling so the trading namespace can never exhaust the whole cluster again.
  # 2026-07-13: a grid fanned out ~2082 worker pods; combined memory tipped the nodes into
  # global OOM (killed apiserver, kubelet, longhorn-manager). These caps bound the memory
  # footprint, pod-object count, and CPU so a runaway grid stays contained.
  #
  # Tightened 2026-07-14 after a full grid tipped node-2 NotReady: the driver is peak object
  # count (live pods → cAdvisor/prometheus series + apiserver churn), not worker pod memory. So the
  # pod cap is the load-bearing number; the CPU/memory ceilings exist to make it schedulable.
  # pods counts the ~6 always-on trading pods too, so grid slots = pods - 6; MAX_INFLIGHT_JOBS
  # (operator) must match those slots or the operator churns FailedCreate. Job TTL self-deletes
  # completed pods, so the total Jobs a grid runs does not raise the peak.
  # quota is namespace-total, not per-node; the scheduler spreads pods.
  #
  # Doubled 2026-08-14 with the cx33→cx43 control-plane upgrade (4 vCPU/8Gi → 8 vCPU/16Gi per node,
  # infra 4ff3ace). Every ceiling here is a namespace TOTAL, so the CPU/memory numbers have to scale
  # with `pods` or the extra pods cannot schedule - per-pod worker resources are unchanged
  # (JOB_MEM_SIGNALS 256Mi, JOB_CPU_REQUEST 500m). 12 concurrent signals workers request 6.8 cores /
  # 4.4Gi, so CPU stays the concurrency limiter and memory keeps headroom for simulation jobs (1Gi each).
  hard:
    requests.cpu: "14"
    requests.memory: 12Gi
    limits.memory: 16Gi
    pods: "20"
