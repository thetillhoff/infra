apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: federated-cloud-platform
resources:
- namespace.yaml
- resourceQuota-fcp.yaml
- limitRange-fcp.yaml
- ghcr-creds.secret.yaml
- fcp-postgres.secret.yaml
- fcp-scrapers.secret.yaml

- rbac.yaml
- rbac-admin-api.yaml

- postgres.yaml
- public-api.yaml
- scraper-api.yaml
- admin-api.yaml
- scrape-aws.yaml
- scrape-azure.yaml
- scrape-gcp.yaml
- scrape-hetzner.yaml
- spot-azure.yaml
- exchange-rate.yaml
- public-web.yaml
# admin-web is tailnet-only: reached through the fcp-admin caddy proxy in
# private-endpoints (fcp-admin.internal.thetillhoff.de). It has no httpRoute, and
# networkPolicy-admin-web below denies everything except that proxy.
- admin-web.yaml

# NetworkPolicy: data/api tiers locked to their real in-cluster callers. The
# web tier (public-web) is intentionally unrestricted - it is the gateway
# entrypoint. (The admin-web `from` entry in networkPolicy-backend is inert
# while admin is undeployed, and ready for when it returns.)
- networkPolicy-postgres.yaml
- networkPolicy-public-api.yaml
- networkPolicy-scraper-api.yaml
- networkPolicy-admin-web.yaml
- networkPolicy-admin-api.yaml

# Public exposure: marketplace public-web only (cloud.thetillhoff.de). The admin
# UI stays unexposed (no route) until it goes tailnet-only - out of scope here.
# TODO: rate limiting still not in place - no cluster precedent yet.
- httpRoute-https.yaml
- httpRoute-http.yaml

- imageRepository-public-api.yaml
- imageRepository-scraper-api.yaml
- imageRepository-admin-api.yaml
- imageRepository-public-web.yaml
- imageRepository-admin-web.yaml
- imageRepository-scrape-aws.yaml
- imageRepository-scrape-azure.yaml
- imageRepository-scrape-gcp.yaml
- imageRepository-scrape-hetzner.yaml
- imageRepository-spot-azure.yaml
- imageRepository-migrations.yaml
- imagePolicy-public-api.yaml
- imagePolicy-scraper-api.yaml
- imagePolicy-admin-api.yaml
- imagePolicy-public-web.yaml
- imagePolicy-admin-web.yaml
- imagePolicy-scrape-aws.yaml
- imagePolicy-scrape-azure.yaml
- imagePolicy-scrape-gcp.yaml
- imagePolicy-scrape-hetzner.yaml
- imagePolicy-spot-azure.yaml
- imagePolicy-migrations.yaml
- imageUpdateAutomation.yaml
