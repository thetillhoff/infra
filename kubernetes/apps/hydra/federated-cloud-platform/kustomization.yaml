apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: federated-cloud-platform
resources:
- namespace.yaml
- resourceQuota-fcp.yaml
- limitRange-fcp.yaml
- ghcr-creds.secret.yaml
- fcp-postgres.secret.yaml
- fcp-clerk.secret.yaml
- fcp-scrapers.secret.yaml

- rbac.yaml
- rbac-admin-backend.yaml

- postgres.yaml
- backend.yaml
- scraper-backend.yaml
- admin-backend.yaml
- scraper.yaml
- spot-scraper.yaml
- exchange-rate.yaml
- frontend.yaml
# frontend-admin is tailnet-only: reached through the fcp-admin caddy proxy in
# private-endpoints (fcp-admin.internal.thetillhoff.de). It has no httpRoute, and
# networkPolicy-frontend-admin below denies everything except that proxy.
- frontend-admin.yaml

# NetworkPolicy: data/api tiers locked to their real in-cluster callers. The
# web tier (frontend) is intentionally unrestricted - it is the gateway
# entrypoint. (The frontend-admin `from` entry in networkPolicy-backend is inert
# while admin is undeployed, and ready for when it returns.)
- networkPolicy-postgres.yaml
- networkPolicy-backend.yaml
- networkPolicy-scraper-backend.yaml
- networkPolicy-frontend-admin.yaml
- networkPolicy-admin-backend.yaml

# Public exposure: marketplace frontend only (cloud.thetillhoff.de). The admin
# UI stays unexposed (no route) until it goes tailnet-only - out of scope here.
# TODO: rate limiting still not in place - no cluster precedent yet.
- httpRoute-https.yaml
- httpRoute-http.yaml

- imageRepository-backend.yaml
- imageRepository-scraper-backend.yaml
- imageRepository-admin-backend.yaml
- imageRepository-frontend.yaml
- imageRepository-frontend-admin.yaml
- imageRepository-scrapers.yaml
- imageRepository-migrations.yaml
- imagePolicy-backend.yaml
- imagePolicy-scraper-backend.yaml
- imagePolicy-admin-backend.yaml
- imagePolicy-frontend.yaml
- imagePolicy-frontend-admin.yaml
- imagePolicy-scrapers.yaml
- imagePolicy-migrations.yaml
- imageUpdateAutomation.yaml
