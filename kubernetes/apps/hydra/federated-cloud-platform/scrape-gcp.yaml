apiVersion: batch/v1
kind: CronJob
metadata:
  name: scrape-gcp
  namespace: federated-cloud-platform
spec:
  schedule: "30 3 * * 0" # weekly, Sunday 03:30 UTC (45m after scrape-azure)
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app: scrape-gcp # NetworkPolicy source selector (reaches backend + scraper-api)
        spec:
          # fsGroup so uid 10001 can write the /cache emptyDir; the rest satisfies
          # the namespace's restricted PodSecurity level.
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            fsGroup: 10001
            seccompProfile:
              type: RuntimeDefault
          imagePullSecrets:
            - name: ghcr-creds
          restartPolicy: OnFailure
          serviceAccountName: scraper-gcp
          initContainers:
            - name: wait-for-backend
              image: busybox:1.37
              command: ["sh", "-c", "until wget -qO- http://public-api.federated-cloud-platform.svc.cluster.local:8080/health && wget -qO- http://scraper-api.federated-cloud-platform.svc.cluster.local:9090/health; do echo waiting; sleep 2; done"]
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
          containers:
            - name: scrape-gcp
              image: ghcr.io/thetillhoff/federated-cloud-platform/scrape-gcp:53 # {"$imagepolicy": "federated-cloud-platform:fcp-scrape-gcp"}
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
              env:
                - name: PUBLIC_API_URL
                  value: http://public-api.federated-cloud-platform.svc.cluster.local:8080
                - name: SCRAPER_API_URL
                  value: http://scraper-api.federated-cloud-platform.svc.cluster.local:9090
                - name: SCRAPER_CACHE_DIR
                  value: /cache
                - name: SCRAPER_CACHE_REFRESH
                  value: "0"
              volumeMounts:
                - name: cache
                  mountPath: /cache
              resources:
                # "Light" was wrong: every weekly run since the per-provider
                # split was OOMKilled (exit 137) at 512Mi, and it died before
                # logging anything, so the CronJob just showed no successful run.
                # The adapter buffers the provider's whole offer slice in memory
                # (adapter.Scrape returns []Offer), which is the same reason AWS
                # needed its ceiling raised.
                # ponytail: 2Gi is a jump from the 512Mi OOM, not a measured
                # peak. The weekly scrapers are staggered so only one runs at a
                # time; check actual usage on the next run and tighten.
                requests:
                  cpu: 100m
                  memory: 512Mi
                  ephemeral-storage: 256Mi
                limits:
                  cpu: 500m
                  memory: 2Gi
                  ephemeral-storage: 512Mi
          volumes:
            # Ephemeral working cache — only holds parsed offers + small HTML
            # pages. Re-downloadable, wiped when the Job pod ends.
            - name: cache
              emptyDir:
                sizeLimit: 2Gi
