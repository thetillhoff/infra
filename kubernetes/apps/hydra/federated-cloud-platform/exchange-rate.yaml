apiVersion: batch/v1
kind: CronJob
metadata:
  name: exchange-rate
  namespace: federated-cloud-platform
spec:
  # Daily. Runs after all 4 weekly scraper CronJobs' Sunday window
  # (02:00-04:15 UTC, see scrape-<provider>.yaml) so it never starts alongside
  # one of them. ECB publishes once per business day.
  schedule: "0 5 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app: exchange-rate # NetworkPolicy source selector (reaches postgres)
        spec:
          imagePullSecrets:
            - name: ghcr-creds
          restartPolicy: OnFailure
          initContainers:
            # Backend readiness implies the schema migrations have run.
            - name: wait-for-backend
              image: busybox:1.37
              command: ["sh", "-c", "until wget -qO- http://public-api.federated-cloud-platform.svc.cluster.local:8080/health; do echo waiting; sleep 2; done"]
              securityContext:
                runAsNonRoot: true
                runAsUser: 10001
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
                seccompProfile:
                  type: RuntimeDefault
          containers:
            - name: exchange-rate
              # Reuses the backend image + its ImagePolicy; runs the subcommand.
              image: ghcr.io/thetillhoff/federated-cloud-platform/public-api:40 # {"$imagepolicy": "federated-cloud-platform:fcp-public-api"}
              command: ["/public-api", "refresh-exchange-rate"]
              env:
                - name: POSTGRES_USER
                  valueFrom:
                    secretKeyRef:
                      name: fcp-postgres
                      key: user
                - name: POSTGRES_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: fcp-postgres
                      key: password
                - name: POSTGRES_HOST
                  value: postgres.federated-cloud-platform.svc.cluster.local
                - name: POSTGRES_PORT
                  value: "5432"
                - name: POSTGRES_SCHEMA
                  value: fcp
              securityContext:
                runAsNonRoot: true
                runAsUser: 10001
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
                seccompProfile:
                  type: RuntimeDefault
