apiVersion: batch/v1
kind: CronJob
metadata:
  name: spot-azure
  namespace: federated-cloud-platform
spec:
  # Hourly. Spot prices move constantly; this samples them for the per-instance
  # spot history page.
  schedule: "0 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app: spot-azure # NetworkPolicy source selector (reaches backend)
        spec:
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            seccompProfile:
              type: RuntimeDefault
          imagePullSecrets:
            - name: ghcr-creds
          restartPolicy: OnFailure
          initContainers:
            - name: wait-for-backend
              image: busybox:1.37
              command: ["sh", "-c", "until wget -qO- http://public-api.federated-cloud-platform.svc.cluster.local:8080/health; do echo waiting; sleep 2; done"]
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
          containers:
            - name: spot-azure
              image: ghcr.io/thetillhoff/federated-cloud-platform/spot-azure:41 # {"$imagepolicy": "federated-cloud-platform:fcp-spot-azure"}
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
              env:
                - name: PUBLIC_API_URL
                  value: http://public-api.federated-cloud-platform.svc.cluster.local:8080
                - name: AZURE_SCRAPER_KEY
                  valueFrom:
                    secretKeyRef:
                      name: fcp-scraper
                      key: azureKey
              resources:
                # Light: pages the Azure retail API and holds ~47k small spot rows.
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  cpu: 500m
                  memory: 256Mi
