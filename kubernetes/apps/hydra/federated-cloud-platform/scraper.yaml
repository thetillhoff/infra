apiVersion: batch/v1
kind: CronJob
metadata:
  name: scraper
  namespace: federated-cloud-platform
spec:
  schedule: "0 2 * * 0" # weekly, Sunday 02:00 UTC
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app: scraper # NetworkPolicy source selector (reaches backend + scraper-backend)
        spec:
          imagePullSecrets:
            - name: ghcr-creds
          restartPolicy: OnFailure
          initContainers:
            - name: wait-for-backend
              image: busybox:1.37
              command: ["sh", "-c", "until wget -qO- http://backend.federated-cloud-platform.svc.cluster.local:8080/health && wget -qO- http://scraper-backend.federated-cloud-platform.svc.cluster.local:9090/health; do echo waiting; sleep 2; done"]
          containers:
            - name: scraper
              image: ghcr.io/thetillhoff/federated-cloud-platform/scrapers:28 # {"$imagepolicy": "federated-cloud-platform:fcp-scrapers"}
              env:
                - name: API_URL
                  value: http://backend.federated-cloud-platform.svc.cluster.local:8080
                - name: SCRAPER_BACKEND_URL
                  value: http://scraper-backend.federated-cloud-platform.svc.cluster.local:9090
                - name: HETZNER_SCRAPER_KEY
                  valueFrom:
                    secretKeyRef:
                      name: fcp-scrapers
                      key: hetznerKey
                - name: AWS_SCRAPER_KEY
                  valueFrom:
                    secretKeyRef:
                      name: fcp-scrapers
                      key: awsKey
                - name: GCP_SCRAPER_KEY
                  valueFrom:
                    secretKeyRef:
                      name: fcp-scrapers
                      key: gcpKey
                - name: AZURE_SCRAPER_KEY
                  valueFrom:
                    secretKeyRef:
                      name: fcp-scrapers
                      key: azureKey
                - name: SCRAPER_CACHE_DIR
                  value: /cache
                - name: SCRAPER_CACHE_REFRESH
                  value: "0"
              volumeMounts:
                - name: cache
                  mountPath: /cache
              resources:
                # Providers run serially and AWS's big pricing files are
                # streamed (json.Decoder), never buffered — so peak RAM is low.
                # req=limit (Guaranteed QoS) for a predictable batch job.
                requests:
                  cpu: 250m
                  memory: 512Mi
                  ephemeral-storage: 1Gi
                limits:
                  cpu: "1"
                  memory: 512Mi
                  ephemeral-storage: 2Gi
          volumes:
            # Ephemeral working cache — only holds parsed offers + small HTML
            # pages (raw AWS responses are streamed, not stored). Re-downloadable,
            # wiped when the Job pod ends.
            - name: cache
              emptyDir:
                sizeLimit: 2Gi
