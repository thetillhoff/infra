apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: scraper-api
  namespace: federated-cloud-platform
# Owns scraper_runs writes. Reached by the four per-provider scrape CronJobs
# (run lifecycle), the public backend (proxies GET /scraper/runs/latest) and
# admin-api (proxies the admin-only /scraper/runs/latest/progress). spot-azure
# never touches scraper_runs, so it is intentionally not in this list. Nothing
# else.
spec:
  podSelector:
    matchLabels: { app: scraper-api }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app
                operator: In
                values: [scrape-aws, scrape-azure, scrape-gcp, scrape-hetzner]
        - podSelector:
            matchLabels: { app: public-api }
        - podSelector:
            matchLabels: { app: admin-api }
      ports:
        - { protocol: TCP, port: 9090 }
