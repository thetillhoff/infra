apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: cloud-thetillhoff-de-https
spec:
  parentRefs:
    - name: https-gateway-thetillhoff-de
      namespace: gateways
  hostnames:
    - cloud.thetillhoff.de
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        # Public marketplace only. The frontend's Caddy proxies the public API
        # prefixes to backend in-cluster; admin prefixes live only in the
        # frontend-admin Caddyfile, which is not routed here.
        - name: frontend
          port: 8080
