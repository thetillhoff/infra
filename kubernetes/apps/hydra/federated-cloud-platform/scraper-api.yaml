apiVersion: apps/v1
kind: Deployment
metadata:
  name: scraper-api
  namespace: federated-cloud-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: scraper-api
  template:
    metadata:
      labels:
        app: scraper-api
    spec:
      imagePullSecrets:
        - name: ghcr-creds
      containers:
        - name: scraper-api
          image: ghcr.io/thetillhoff/federated-cloud-platform/scraper-api:44 # {"$imagepolicy": "federated-cloud-platform:fcp-scraper-api"}
          env:
            - name: HOST
              value: "0.0.0.0"
            - name: PORT
              value: "9090"
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: fcp-postgres
                  key: user
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: fcp-postgres
                  key: password
            - name: POSTGRES_HOST
              value: postgres.federated-cloud-platform.svc.cluster.local
            - name: POSTGRES_PORT
              value: "5432"
            - name: POSTGRES_SCHEMA
              value: fcp
          ports:
            - containerPort: 9090
          readinessProbe:
            httpGet:
              path: /health
              port: 9090
            initialDelaySeconds: 5
            periodSeconds: 5
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: scraper-api
  namespace: federated-cloud-platform
spec:
  type: ClusterIP
  selector:
    app: scraper-api
  ports:
    - port: 9090
      targetPort: 9090
