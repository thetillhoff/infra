apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres
  namespace: federated-cloud-platform
# Pod-scoped, not namespace-wide: public-web is the exposed attack
# surface, so a namespace-wide `podSelector: {}` would let a compromised
# public-web reach the DB directly - the exact pivot this gate exists to block.
# Only the real DB clients may connect: backend (+ its atlas init containers,
# same pod label), scraper-api, admin-api, and the exchange-rate Job.
spec:
  podSelector:
    matchLabels: { app: postgres }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: { app: public-api }
        - podSelector:
            matchLabels: { app: scraper-api }
        - podSelector:
            matchLabels: { app: admin-api }
        - podSelector:
            matchLabels: { app: exchange-rate }
      ports:
        - { protocol: TCP, port: 5432 }
