apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: federated-cloud-platform
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
  clusterIP: None
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: federated-cloud-platform
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:18-alpine
          env:
            - name: POSTGRES_DB
              value: fcp
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: fcp-postgres
                  key: user
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: fcp-postgres
                  key: password
          ports:
            - containerPort: 5432
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
  volumeClaimTemplates:
    - metadata:
        name: postgres-data
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: longhorn
        resources:
          requests:
            # This must stay 5Gi to match the live StatefulSet: volumeClaimTemplates
            # storage is immutable on an existing StatefulSet, so Flux's dry-run
            # rejects any other value here and blocks the whole Kustomization. The
            # real PVC was grown to 10Gi out-of-band with `kubectl patch pvc` after
            # unfiltered spot-price sampling filled the original 5Gi disk - k8s never
            # shrinks an existing PVC to match this template, so the drift is safe.
            # Only relevant again if the StatefulSet is ever recreated from scratch.
            storage: 5Gi
