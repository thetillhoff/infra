apiVersion: batch/v1
kind: CronJob
metadata:
  name: scrape-aws
  namespace: federated-cloud-platform
spec:
  schedule: "0 2 * * 0" # weekly, Sunday 02:00 UTC
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app: scrape-aws # NetworkPolicy source selector (reaches backend + scraper-api)
        spec:
          # fsGroup so uid 10001 can write the /cache emptyDir; the rest satisfies
          # the namespace's restricted PodSecurity level.
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            fsGroup: 10001
            seccompProfile:
              type: RuntimeDefault
          imagePullSecrets:
            - name: ghcr-creds
          restartPolicy: OnFailure
          initContainers:
            - name: wait-for-backend
              image: busybox:1.37
              command: ["sh", "-c", "until wget -qO- http://public-api.federated-cloud-platform.svc.cluster.local:8080/health && wget -qO- http://scraper-api.federated-cloud-platform.svc.cluster.local:9090/health; do echo waiting; sleep 2; done"]
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
          containers:
            - name: scrape-aws
              image: ghcr.io/thetillhoff/federated-cloud-platform/scrape-aws:42 # {"$imagepolicy": "federated-cloud-platform:fcp-scrape-aws"}
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
              env:
                - name: PUBLIC_API_URL
                  value: http://public-api.federated-cloud-platform.svc.cluster.local:8080
                - name: SCRAPER_API_URL
                  value: http://scraper-api.federated-cloud-platform.svc.cluster.local:9090
                - name: AWS_SCRAPER_KEY
                  valueFrom:
                    secretKeyRef:
                      name: fcp-scraper
                      key: awsKey
                - name: SCRAPER_CACHE_DIR
                  value: /cache
                - name: SCRAPER_CACHE_REFRESH
                  value: "0"
              volumeMounts:
                - name: cache
                  mountPath: /cache
              resources:
                # The adapter buffers each provider's full offer slice in memory
                # (adapter.Scrape returns []Offer), and AWS's set is large — 512Mi
                # OOM-killed the run before it could report stats. Burstable: keep
                # the request modest (fits the namespace ResourceQuota) but allow a
                # 3Gi ceiling so the AWS pass completes.
                # ponytail: 3Gi is a measured jump from the 512Mi OOM, not a proven
                # peak — raise further if AWS still OOMs.
                requests:
                  cpu: 250m
                  memory: 1Gi
                  ephemeral-storage: 1Gi
                limits:
                  cpu: "1"
                  memory: 3Gi
                  ephemeral-storage: 2Gi
          volumes:
            # Ephemeral working cache — only holds parsed offers + small HTML
            # pages (raw AWS responses are streamed, not stored). Re-downloadable,
            # wiped when the Job pod ends.
            - name: cache
              emptyDir:
                sizeLimit: 2Gi
