apiVersion: batch/v1
kind: CronJob
metadata:
  name: scrape-azure
  namespace: federated-cloud-platform
spec:
  schedule: "45 2 * * 0" # weekly, Sunday 02:45 UTC (45m after scrape-aws, which is the one long enough to risk overrun)
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app: scrape-azure # NetworkPolicy source selector (reaches backend + scraper-api)
        spec:
          # fsGroup so uid 10001 can write the /cache emptyDir; the rest satisfies
          # the namespace's restricted PodSecurity level.
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            fsGroup: 10001
            seccompProfile:
              type: RuntimeDefault
          imagePullSecrets:
            - name: ghcr-creds
          restartPolicy: OnFailure
          initContainers:
            - name: wait-for-backend
              image: busybox:1.37
              command: ["sh", "-c", "until wget -qO- http://public-api.federated-cloud-platform.svc.cluster.local:8080/health && wget -qO- http://scraper-api.federated-cloud-platform.svc.cluster.local:9090/health; do echo waiting; sleep 2; done"]
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
          containers:
            - name: scrape-azure
              image: ghcr.io/thetillhoff/federated-cloud-platform/scrape-azure:43 # {"$imagepolicy": "federated-cloud-platform:fcp-scrape-azure"}
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
              env:
                - name: PUBLIC_API_URL
                  value: http://public-api.federated-cloud-platform.svc.cluster.local:8080
                - name: SCRAPER_API_URL
                  value: http://scraper-api.federated-cloud-platform.svc.cluster.local:9090
                - name: AZURE_SCRAPER_KEY
                  valueFrom:
                    secretKeyRef:
                      name: fcp-scraper
                      key: azureKey
                - name: SCRAPER_CACHE_DIR
                  value: /cache
                - name: SCRAPER_CACHE_REFRESH
                  value: "0"
              volumeMounts:
                - name: cache
                  mountPath: /cache
              resources:
                # Light: never held AWS's ~400MB payload.
                requests:
                  cpu: 50m
                  memory: 128Mi
                  ephemeral-storage: 256Mi
                limits:
                  cpu: 500m
                  memory: 512Mi
                  ephemeral-storage: 512Mi
          volumes:
            # Ephemeral working cache — only holds parsed offers + small HTML
            # pages. Re-downloadable, wiped when the Job pod ends.
            - name: cache
              emptyDir:
                sizeLimit: 2Gi
