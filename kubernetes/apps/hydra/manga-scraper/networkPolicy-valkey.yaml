apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: valkey
  namespace: manga-scraper
# Only the api uses the cache. Valkey has no authentication of its own, so this is
# what stands between an unrelated pod and every cached page.
spec:
  podSelector:
    matchLabels: {app: valkey}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {app: api}
      ports:
        - {protocol: TCP, port: 6379}
