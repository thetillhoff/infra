apiVersion: v1
kind: ResourceQuota
metadata:
  name: manga-scraper
  namespace: manga-scraper
# The api runs a real headed Chromium, whose memory use depends on the pages it
# is asked to render. This cluster has been taken down by a global OOM before
# (see the repo's CLAUDE.md), so the namespace gets a hard ceiling rather than
# trusting per-pod limits to be complete.
spec:
  hard:
    requests.cpu: "1"
    requests.memory: 1Gi
    # Headroom for one surged api pod on top of everything running, measured
    # rather than estimated: the steady state is 3800m / 2880Mi, and the api is
    # allowed 2000m / 1536Mi, so a rollout peaks at 5800m / 4416Mi. Too tight and
    # the quota rejects the surged pod — the rollout then stalls with the old pod
    # still serving, which is how this was found. Limits are ceilings, not
    # reservations; the requests above are what the scheduler has to fit.
    limits.cpu: "6"
    limits.memory: 5Gi
    pods: "10"
