apiVersion: v1
kind: ResourceQuota
metadata:
  name: manga-scraper
  namespace: manga-scraper
# The api runs a real headed Chromium, whose memory use depends on the pages it
# is asked to render. This cluster has been taken down by a global OOM before
# (see the repo's CLAUDE.md), so the namespace gets a hard ceiling rather than
# trusting per-pod limits to be complete.
spec:
  hard:
    requests.cpu: "1"
    requests.memory: 1Gi
    # Headroom for one surged pod during a rolling update on top of everything
    # running: the api alone is allowed 2000m for Chromium, and a ui rollout adds
    # 500m for as long as both pods exist. Memory, not CPU, is what took the
    # cluster down before, so this ceiling is the loose one.
    limits.cpu: "5"
    limits.memory: 4Gi
    pods: "10"
