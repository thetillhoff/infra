apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: manga-scraper
spec:
  selector:
    app: api
  ports:
    # Named metrics so Prometheus finds it (monitoring/prometheus/values.yaml scrapes
    # any port named metrics): /metrics has the preload gauges and the histograms of
    # what browsers measured of their own loading.
    - name: metrics
      port: 3001
      targetPort: 3001
