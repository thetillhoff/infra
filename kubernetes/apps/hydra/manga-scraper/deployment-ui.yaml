apiVersion: apps/v1
kind: Deployment
metadata:
  name: ui
  namespace: manga-scraper
spec:
  replicas: 1
  # Spelled out rather than left to the defaults: with one replica the default
  # 25% maxUnavailable rounds down to zero anyway, but the reader's whole
  # experience of a deploy depends on that rounding, which is too much to leave
  # implicit.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: ui
  template:
    metadata:
      labels:
        app: ui
    spec:
      imagePullSecrets:
        - name: ghcr-creds
      containers:
        - name: ui
          image: ghcr.io/thetillhoff/manga-scraper-ui:74 # {"$imagepolicy": "manga-scraper:manga-scraper-ui"}
          ports:
            - containerPort: 3000
          env:
            - name: API_BASE_URL
              value: http://api:3001
            - name: WEB_PORT
              value: "3000"
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          # Outlives the race between endpoint removal and SIGTERM, so a
          # request in flight during a deploy is not answered with a closed
          # connection. Same reasoning as the api's.
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "5"]
          # /health answers from the ui process alone. Probing a real page would
          # make this pod's life depend on api and postgres, which have health
          # checks of their own — a slow catalog query then restarts a ui that is
          # perfectly alive.
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 192Mi
