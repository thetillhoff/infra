apiVersion: apps/v1
kind: Deployment
metadata:
  name: ui
  namespace: manga-scraper
spec:
  replicas: 1
  # Recreate, like the api: a RollingUpdate surges a second pod, and with valkey
  # in the namespace the quota's limits.cpu has less headroom than one extra ui
  # pod needs — the rollout would sit in FailedCreate instead. One replica behind
  # a tailnet-only proxy can afford the seconds of downtime.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: ui
  template:
    metadata:
      labels:
        app: ui
    spec:
      imagePullSecrets:
        - name: ghcr-creds
      containers:
        - name: ui
          image: ghcr.io/thetillhoff/manga-scraper-ui:7 # {"$imagepolicy": "manga-scraper:manga-scraper-ui"}
          ports:
            - containerPort: 3000
          env:
            - name: API_BASE_URL
              value: http://api:3001
            - name: WEB_PORT
              value: "3000"
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 30
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 192Mi
