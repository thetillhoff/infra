apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: manga-scraper
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:17-alpine
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata # subdir: mount root holds lost+found
            - name: POSTGRES_DB
              value: manga_scraper
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: manga-scraper-postgres
                  key: user
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: manga-scraper-postgres
                  key: password
          ports:
            - containerPort: 5432
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
            - name: init
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              cpu: 1000m
              memory: 512Mi
      volumes:
        - name: init
          configMap:
            name: postgres-init
  volumeClaimTemplates:
    - metadata:
        name: postgres-data
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: longhorn
        resources:
          requests:
            # Covers the catalog plus cover images, which live in the database
            # (~14KB each). Longhorn volumes can be expanded if it fills.
            storage: 8Gi
