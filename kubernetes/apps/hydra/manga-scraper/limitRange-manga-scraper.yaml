apiVersion: v1
kind: LimitRange
metadata:
  name: manga-scraper
  namespace: manga-scraper
# A pod without requests would be BestEffort and the first thing the kernel OOM
# killer takes; the quota above also rejects pods that declare nothing.
spec:
  limits:
    - type: Container
      default:
        cpu: 200m
        memory: 256Mi
      defaultRequest:
        cpu: 50m
        memory: 64Mi
