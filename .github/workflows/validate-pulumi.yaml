name: Validate Pulumi changes

# A type check only, with no Pulumi token: a preview reads the stack state (Talos secrets,
# kubeconfig), and it would run the code of every npm package that Renovate bumps.
on:
  push:
    paths:
      - ".github/**"
      - "pulumi/**"
  workflow_dispatch:

jobs:
  typecheck:
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: pulumi
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          cache: 'npm'
          node-version-file: pulumi/.nvmrc
          cache-dependency-path: 'pulumi/package-lock.json'
      - run: npm ci --ignore-scripts
      - run: npx tsc --noEmit
