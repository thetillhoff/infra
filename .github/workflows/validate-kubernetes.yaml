name: Validate Kubernetes manifests

# Runs on every branch without a path filter: Renovate automerges a branch only after its checks pass.
on:
  push:
  workflow_dispatch:

jobs:
  kubeconform:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Build every Flux Kustomization
        run: |
          mkdir build
          for f in kubernetes/clusters/hydra/*.yaml; do
            kubectl kustomize "$(awk '/^  path:/ {print $2}' "$f")" > "build/$(basename "$f")"
          done

      # Secrets hold SOPS metadata. The trading CRDs and their objects have no public schema. The
      # catalog schema of RecurringJob lacks the task system-backup of Longhorn 1.13.
      - uses: docker://ghcr.io/yannh/kubeconform:v0.8.0@sha256:faffaf43f95aa6425306e1ab8d6fcad72acb9049158f38e574c085ea1ec0f64e
        with:
          args: >-
            -strict -summary
            -skip Secret,CustomResourceDefinition,AutoTrade,StrategyConfig,RecurringJob
            -schema-location default
            -schema-location https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json
            build

  # Builds each Flux Kustomization and renders each HelmRelease with its values.
  flux-local:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: docker://ghcr.io/allenporter/flux-local:v8.4.0@sha256:c0be852e30f299ce6a220cc992b0c21a2a0b0684cc17713b9d718e18d9c8beff
        env:
          HOME: /tmp
        with:
          args: test --enable-helm --path kubernetes/clusters/hydra
