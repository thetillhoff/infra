- apt:
    pkg:
      - dpkg-dev
      - linux-headers-generic
      - zfs-dkms
      - zfsutils-linux

- community.general.modprobe:
    name: zfs
    state: present

- stat:
    path: /mnt/hot
  register: storage_dir
- when: not storage_dir.stat.exists
  block:
    - command: "sgdisk --zap-all /dev/disk/by-id/ata-{{ item }}"
      loop:
      - Samsung_SSD_850_EVO_250GB_S2R6NX0JB23647W
      - Samsung_SSD_860_EVO_250GB_S3YJNX0KB49233X
    - command: partprobe
      # inform kernel about partition changes
    - command: |
        zpool create -m /mnt/hot -f hot mirror -o feature@lz4_compress=enabled
        /dev/disk/by-id/ata-Samsung_SSD_850_EVO_250GB_S2R6NX0JB23647W
        /dev/disk/by-id/ata-Samsung_SSD_860_EVO_250GB_S3YJNX0KB49233X
      # Since compression is enabled by default for zfs, and the default is either lzjb or lz4 (if this feature is enabled) the latter makes more sense, since it is way faster on both compressable and non-compressable data.

- stat:
    path: /mnt/cold
  register: storage_dir
- when: not storage_dir.stat.exists
  block:
    - command: "sgdisk --zap-all /dev/disk/by-id/ata-{{ item }}"
      loop:
      - WDC_WD30EZRX-00D8PB0_WD-WCC4N0CNYEZD
      - WDC_WD30EZRX-00D8PB0_WD-WCC4N1XYTYZY
      - WDC_WD30EZRX-00D8PB0_WD-WCC4N2TXL9J4
    - command: |
        zpool create -m /mnt/cold -f cold raidz -o feature@lz4_compress=enabled
        /dev/disk/by-id/ata-WDC_WD30EZRX-00D8PB0_WD-WCC4N0CNYEZD
        /dev/disk/by-id/ata-WDC_WD30EZRX-00D8PB0_WD-WCC4N1XYTYZY
        /dev/disk/by-id/ata-WDC_WD30EZRX-00D8PB0_WD-WCC4N2TXL9J4
      # Since compression is enabled by default for zfs, and the default is either lzjb or lz4 (if this feature is enabled) the latter makes more sense, since it is way faster on both compressable and non-compressable data.
      #-o casesensitivity=mixed -o nbmand=on

# Without this every file read also writes its access time to the disks.
- community.general.zfs:
    name: "{{ item }}"
    state: present
    extra_zfs_properties:
      atime: "off"
  loop:
    - hot
    - cold

# Disabled until the extra SSD is installed. Read cache for `cold`, safe to lose.
# Replace <ssd-id> with the name from `ls -l /dev/disk/by-id/`, then remove the `#`.
# l2arc_mfuonly keeps blocks that were read once out of the cache. The default
# l2arc_noprefetch=1 already keeps sequential streaming reads out.
# First check that /sys/module/zfs/parameters/l2arc_mfuonly exists on the host.
# If not, the ZFS version is too old: leave out the last two tasks.
# - command: zpool status cold
#   register: cold_status
#   changed_when: false
# - command: zpool add cold cache /dev/disk/by-id/<ssd-id>
#   when: "'<ssd-id>' not in cold_status.stdout"
# - copy:
#     dest: /etc/modprobe.d/zfs-l2arc.conf
#     content: "options zfs l2arc_mfuonly=1\n"
# - shell: echo 1 > /sys/module/zfs/parameters/l2arc_mfuonly
#   changed_when: false

# Weekly ZFS snapshots (keep last 8)
- copy:
    src: zfs-weekly-snapshot.sh
    dest: /usr/local/bin/zfs-weekly-snapshot.sh
    mode: '0755'
- copy:
    src: zfs-snapshot-weekly.service
    dest: /etc/systemd/system/zfs-snapshot-weekly.service
- copy:
    src: zfs-snapshot-weekly.timer
    dest: /etc/systemd/system/zfs-snapshot-weekly.timer
- systemd:
    name: zfs-snapshot-weekly.timer
    enabled: yes
    state: started
    daemon_reload: yes

# Allow SMB port/s
- ufw: # allow connections to port
    rule: allow
    port: 445
    proto: tcp

# Stop container before rebuilding to ensure port 445 is released
- community.docker.docker_compose_v2:
    project_src: "{{ role_path }}/files/"
    state: stopped
  ignore_errors: true

# Start container
- community.docker.docker_compose_v2:
    project_src: "{{ role_path }}/files/"
    remove_orphans: true
    build: always
