# tailscale vpn
- apt:
    pkg:
      - gnupg
- get_url:
    # noarmor.gpg is already a binary keyring, no `gpg --dearmor` needed.
    url: "https://pkgs.tailscale.com/stable/{{ ansible_distribution | lower }}/{{ ansible_distribution_release }}.noarmor.gpg"
    dest: /usr/share/keyrings/tailscale-archive-keyring.gpg
    mode: "0644"
- file:
    # ponytail: one-time migration cleanup for stale/conflicting entries left
    # by earlier apt_key-based setups (manual install + prior ansible runs).
    # Remove these two tasks once every host has run them once.
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/apt/sources.list.d/pkgs_tailscale_com_stable_ubuntu.list
    - /etc/apt/sources.list.d/tailscale.list
- apt_repository:
    repo: "deb [signed-by=/usr/share/keyrings/tailscale-archive-keyring.gpg] https://pkgs.tailscale.com/stable/{{ ansible_distribution | lower }} {{ ansible_distribution_release }} main"
    filename: tailscale
    update_cache: yes
- apt:
    pkg:
      - tailscale
- block:
  - command: tailscale status
    # This commands either fails with "Logged out." or succeeds with "Logged in. <...>"
    changed_when: false
  rescue:
  # authkey from sops host_vars (tailscale.sops.yaml) — an OAuth client secret.
  # ephemeral=false keeps this persistent server registered when offline;
  # preauthorized=true skips manual device approval. --reset makes the tags/flags
  # authoritative, so this also retags a node that was authed without them.
  - command: >-
      tailscale up
      --hostname={{ inventory_hostname }}
      --authkey '{{ tailscale_authkey }}?ephemeral=false&preauthorized=true'
      --advertise-tags=tag:service,tag:exit
      --advertise-exit-node
      --reset

- command: tailscale ip -4
  register: tailscale_ip
  changed_when: false

- ufw: # allow connections from private ips
    rule: allow
    dest: "{{ tailscale_ip.stdout }}"
