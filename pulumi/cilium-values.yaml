# Values documented at https://artifacthub.io/packages/helm/cilium/cilium/1.20.0
# Keep this in sync with `versions.cilium` in index.ts - that constant is what actually installs.

# namespaceOverride: cilium-system # default is kube-system

# Docs for cilium on talos at https://www.talos.dev/v1.10/kubernetes-guides/network/deploying-cilium/#without-kube-proxy
ipam:
  mode: kubernetes
kubeProxyReplacement: true
securityContext:
  capabilities:
    ciliumAgent:
      - CHOWN
      - KILL
      - NET_ADMIN
      - NET_RAW
      - IPC_LOCK
      # - SYS_MODULE # "As Talos does not allow loading Kernel modules by Kubernetes workloads, SYS_MODULE needs to be dropped from the Cilium default capability list."
      - SYS_ADMIN
      - SYS_RESOURCE
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    cleanCiliumState:
      - NET_ADMIN
      - SYS_ADMIN
      - SYS_RESOURCE
cgroup:
  autoMount:
    enabled: false
  hostRoot: /sys/fs/cgroup
k8sServiceHost: localhost
k8sServicePort: 7445
# ---
# Enabling IPv6
# TODO: Enable this once we have IPv6 support in the cluster (talos)
# More info at https://docs.cilium.io/en/stable/helm-reference/
# ipv6:
#   enabled: true
# ---
encryption:
  enabled: true # This enabled encryption for pod-to-pod traffic
  type: wireguard
  # Node Encryption is not useful to add, since "Cilium automatically disables node-to-node encryption from and to Kubernetes control-plane nodes"
  # More info at https://docs.cilium.io/en/stable/security/network/encryption-wireguard/#node-to-node-encryption-beta
  # nodeEncryption: true
# ---
# Enabling gatewayAPI
# Using hostNetwork mode removes the need for separate loadbalancer
# More info at https://docs.cilium.io/en/stable/network/servicemesh/gateway-api/gateway-api/#host-network-mode
gatewayAPI:
  enabled: true
  hostNetwork:
    enabled: true
  # ALPN will attempt HTTP/2, then HTTP 1.1.
  # Note that this will also enable appProtocol support, and services that wish to use HTTP/2 will need to indicate that via their `appProtocol`.
  enableAlpn: true
  enableAppProtocol: true
# Enabling dedicated envoy daemonset for the gateway listener
# The additional capabilities are required for gateways to listen on privileged ports
# More info at https://docs.cilium.io/en/stable/network/servicemesh/gateway-api/gateway-api/#bind-to-privileged-port
envoy:
  enabled: true
  securityContext:
    capabilities:
      keepCapNetBindService: true
      envoy:
        - NET_ADMIN
        - SYS_ADMIN
        - NET_BIND_SERVICE
operator:
  # Enable cilium metrics
  prometheus:
    enabled: true
    metricsService: true

  # Removing the built-in pod restart selector to make cilium restart all unmanaged pods, not just kube-dns
  extraArgs:
  - '--pod-restart-selector=""'
# Enable hubble
hubble:
  enabled: true
  metrics:
    enableOpenMetrics: true
    enabled:
      - "dns:query;ignoreAAAA"
      - drop
      - tcp
      - flow
      - icmp
      # port-distribution dropped: hubble_port_distribution_total was ~39k series (one per
      # observed port) with little observability value on this cluster.
      # httpV2: dropped source_ip/destination_ip labels (unbounded — every pod IP pair × method ×
      # status × le buckets; churns on pod restarts; ~51k series) and exemplars. Workload/namespace
      # labels stay: same per-service HTTP golden signals, bounded cardinality. Cuts prometheus
      # head RAM by ~0.7-1GB (was the top driver of its 2.75GB / 352k active series).
      - "httpV2:labelsContext=source_namespace,source_workload,destination_namespace,destination_workload,traffic_direction"
  # L7 flows carry full request headers verbatim - measured: `Cookie` and `Authorization` values
  # were readable in `hubble observe -o json`. Tolerable while flows only live in the in-memory ring
  # buffer (minutes), not once a flow exporter persists them to Loki. `headers.allow` is an
  # allowlist, so anything not named here is redacted - a new sensitive header cannot leak by
  # being forgotten. Trading a little request detail for not storing credentials.
  redact:
    enabled: true
    http:
      urlQuery: true
      headers:
        allow:
          - ":method"
          - ":scheme"
          - "Accept"
          - "Referer"
          - "User-Agent"
          - "X-Envoy-External-Address"
          - "X-Forwarded-For"
          - "X-Request-Id"
  # Durable access log: who reached which app from which IP. The in-memory ring buffer holds
  # ~4095 flows/node and churns in well under a minute at observed rates, so anything older than
  # "just now" is only answerable from here. `stdout` (a literal, not a path) makes the agent log
  # flows instead of writing a rotated file - alloy already tails every pod's stdout, so they reach
  # Loki with no alloy change, under {container="cilium-agent"} where a 7d retention bounds them.
  #
  # allowList keeps only L7 (event_type 129 = access log). That is the sole flow type carrying the
  # real client IP: Envoy terminates the connection, so L3/L4 flows show reserved:ingress instead.
  # It is also ~1 row per 324, which is what makes persisting this affordable at all.
  # Depends on `redact` above - do not enable one without the other.
  export:
    static:
      enabled: true
      filePath: stdout
      allowList:
        - '{"event_type":[{"type":129}]}'
  relay:
    enabled: true
  # TLS for the Hubble API is issued by cert-manager via the `selfsigned-ca` ClusterIssuer
  # (defined in kubernetes/infrastructure/resources/cert-manager/). This avoids the drift
  # that the cronJob method causes when the generated secrets go missing between runs.
  # More info at https://docs.cilium.io/en/latest/observability/hubble/configuration/tls/#enable-tls-on-the-hubble-api
  tls:
    auto:
      enabled: true
      method: certmanager
      # 30d leaves under the 1y selfsigned-ca (see certificate-selfsigned-ca.yaml).
      # Leaf renews at ~2/3 (~20d), refreshing its embedded CA snapshot well inside the
      # CA's 1y life - the trust bundle can never go stale-expired between renewals.
      certValidityDuration: 30
      certManagerIssuerRef:
        group: cert-manager.io
        kind: ClusterIssuer
        name: selfsigned-ca
  ui:
    enabled: true

# Enable mutual authentication with SPIRE/SPIFFE
# More info at https://docs.cilium.io/en/latest/network/servicemesh/mutual-authentication/mutual-authentication/#installation
# authentication:
#   enabled: true
#   mutual:
#     spire:
#       enabled: true
#       install:
#         enabled: true

# Enable bandwidth manager to enable rate limiting
# More info at https://docs.cilium.io/en/stable/network/kubernetes/bandwidth-manager/
bandwidthManager:
  enabled: true

# Enable cilium metrics
prometheus:
  enabled: true
  metricsService: true
