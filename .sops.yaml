# creation rules are evaluated sequentially, the first match wins
creation_rules:

  # Ansible sops var files: encrypt ALL values (plain vars have no data/stringData
  # key, so the generic rule below would leave them in plaintext). Must be first.
  - path_regex: 'ansible/.*\.sops\.ya?ml$'
    age: >-
        age1068jmwnqrpg6g2m9aswfwz37fjg7vpwtz5vnxlkcwvf3ed8hjaxsycmf85,
        age1jmznk7lwandq9d7mm6fq69uwpa7hf79p6h6qztz0e20wj2yw2a8qylelvw

  # Every other file. A Kubernetes Secret keeps its metadata readable; a file that is
  # not YAML or JSON (for example users.secret.txt) is encrypted whole.
  - encrypted_regex: '^(data|stringData)$'
    # This is a public key and therefore doesn't have to be secret
    age: >-
        age1068jmwnqrpg6g2m9aswfwz37fjg7vpwtz5vnxlkcwvf3ed8hjaxsycmf85,
        age1jmznk7lwandq9d7mm6fq69uwpa7hf79p6h6qztz0e20wj2yw2a8qylelvw

# Edit file in place
# sops edit <file>

# Update keys as per .sops.yaml
# sops updatekeys <file>
